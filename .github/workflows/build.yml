# Builds every Windows download and attaches them to a GitHub Release.
# Push a tag like v1.2.0 to publish, or run it by hand from the Actions tab.
#
#   VoltFlash-Setup-x.y.z.exe        one-click installer, auto-updates (electron-updater)
#   VoltFlash-Portable-x.y.z.exe     single file, no install
#   VoltFlash-win-x64-x.y.z.zip      Smart App Control friendly build, used by install.ps1
#   VoltFlash-app-x.y.z.zip          app files only, used to update the build above
#   latest.yml + .blockmap           metadata electron-updater reads
name: Build VoltFlash

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Installer and portable exe
        run: npx electron-builder --win nsis portable --publish never

      - name: Smart App Control build (unmodified Electron exe, no asar)
        run: npm run dist:sac

      - name: Zip the Smart App Control build and the app-only update
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          Compress-Archive -Path dist-sac/win-unpacked/* -DestinationPath "dist/VoltFlash-win-x64-$v.zip"
          Compress-Archive -Path dist-sac/win-unpacked/resources/app/* -DestinationPath "dist/VoltFlash-app-$v.zip"
          Get-ChildItem dist -File | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: VoltFlash-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml
            dist/*.blockmap

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml
            dist/*.blockmap
          generate_release_notes: true
