# Builds the Windows installer and portable exe.
# Push a tag like v1.0.0 to publish them on a GitHub Release,
# or run it by hand from the Actions tab to just get the files.
name: Build VoltFlash

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installer and portable exe
        run: npx electron-builder --win nsis portable --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: VoltFlash-windows
          path: dist/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
